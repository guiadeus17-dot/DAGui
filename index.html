<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vilhelm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vilhelm">
<meta name="theme-color" content="#0c0a0e">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #110f13; color: #ece6dc; font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  .box { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .box img { width: 96px; height: 96px; border-radius: 20px; }
  h1 { margin: 0; font: 600 26px Georgia, serif; color: #d9a441; letter-spacing: .02em; }
  .msg { color: #9a909f; font-size: 14.5px; max-width: 380px; }
  .err { color: #f08f86; }
  input { width: min(380px, 100%); box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #d9a441; background: #110f13; color: #ece6dc; font-size: 16px; }
  button { width: min(380px, 100%); padding: 12px; border-radius: 8px; border: 0; background: #d9a441; color: #1b1406; font-size: 16px; font-weight: 700; }
  .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(217,164,65,.25); border-top-color: #d9a441; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="box" id="box"><img src="icon-180.png" alt=""><h1>Dragon Age RPG</h1><div class="spin"></div></div>
<!--
  Permanent loader. It never needs updating: the app itself lives in Apps Script (the Index file)
  and is fetched from there with your password. The device keeps a copy and only downloads it again when it changed.
-->
<script>
(function () {
  var URL_ = String(window.APP_URL || '').trim();
  var box = document.getElementById('box');
  function getConn() { try { return JSON.parse(localStorage.getItem('conn') || 'null'); } catch (e) { return null; } }
  function cached() { try { return { v: localStorage.getItem('appV') || '', html: localStorage.getItem('appHtml') || '' }; } catch (e) { return { v: '', html: '' }; } }
  function show(html) { document.open(); document.write(html); document.close(); }
  function screen(inner) { box.innerHTML = '<img src="icon-180.png" alt=""><h1>Dragon Age RPG</h1>' + inner; }
  function ask(msg) {
    screen((msg ? '<div class="msg err">' + msg + '</div>' : '') +
      '<div class="msg">Enter your <b>password</b>. You only do this once on this device.</div>' +
      '<input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button id="go">Enter</button>');
    var pw = document.getElementById('pw'), go = function () {
      var k = pw.value.trim(); if (!k) return;
      try { localStorage.setItem('conn', JSON.stringify({ url: URL_, key: k })); } catch (e) {}
      start();
    };
    document.getElementById('go').onclick = go;
    pw.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    setTimeout(function () { pw.focus(); }, 50);
  }
  function start() {
    if (!/^https:\/\/script\.google\.com\/\S+\/exec$/.test(URL_)) { screen('<div class="msg err">config.js doesn’t have your Apps Script link yet.</div>'); return; }
    var conn = getConn();
    if (!conn || !conn.key || conn.url !== URL_) { ask(); return; }
    screen('<div class="spin"></div>');
    var c = cached(), done = false;
    // if Google is slow and there is a saved copy, open the saved copy instead of waiting forever
    var slow = setTimeout(function () { if (!done && c.html) { done = true; show(c.html); } }, 6000);
    fetch(URL_, { method: 'POST', body: JSON.stringify({ key: conn.key, fn: 'getApp', args: [c.html ? c.v : ''] }) })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var j = JSON.parse(t);
        if (done) return; done = true; clearTimeout(slow);
        if (!j.ok) {
          if (/password|app key/i.test(j.error || '')) { try { localStorage.removeItem('conn'); } catch (e) {} ask(j.error); return; }
          if (c.html) { show(c.html); return; }
          screen('<div class="msg err">' + (j.error || 'Something went wrong') + '</div><button onclick="location.reload()">Try again</button>');
          return;
        }
        var d = j.data;
        if (d.html) { try { localStorage.setItem('appHtml', d.html); localStorage.setItem('appV', d.v); } catch (e) {} show(d.html); }
        else show(c.html);
      })
      .catch(function () {
        if (done) return; done = true; clearTimeout(slow);
        if (c.html) show(c.html);
        else screen('<div class="msg err">Couldn’t reach Google. Check the internet connection.</div><button onclick="location.reload()">Try again</button>');
      });
  }
  start();
})();
</script>
</body>
</html>
